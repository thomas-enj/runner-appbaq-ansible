---
- name: Create runner directory
  ansible.builtin.file:
    path: /home/azureuser/actions-runner
    state: directory
    owner: azureuser
    group: azureuser
    mode: '0755'

- name: Check for installed runner binary
  ansible.builtin.stat:
    path: /home/azureuser/actions-runner/bin/Runner.Listener
  register: runner_setup_binary

- name: Read installed runner version
  ansible.builtin.command: /home/azureuser/actions-runner/bin/Runner.Listener --version
  become: true
  become_user: azureuser
  register: runner_setup_installed_version
  changed_when: false
  when: runner_setup_binary.stat.exists

- name: Download GitHub Actions Runner archive
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ runner_setup_version }}/actions-runner-linux-x64-{{ runner_setup_version }}.tar.gz"
    dest: "/home/azureuser/actions-runner-{{ runner_setup_version }}.tar.gz"
    checksum: "{{ runner_setup_archive_checksum }}"
    owner: azureuser
    group: azureuser
    mode: '0644'
  when: not runner_setup_binary.stat.exists or runner_setup_installed_version.stdout | trim != runner_setup_version

- name: Extract GitHub Actions Runner
  ansible.builtin.unarchive:
    src: "/home/azureuser/actions-runner-{{ runner_setup_version }}.tar.gz"
    dest: /home/azureuser/actions-runner
    remote_src: true
    owner: azureuser
    group: azureuser
  when: not runner_setup_binary.stat.exists or runner_setup_installed_version.stdout | trim != runner_setup_version

- name: Configure the GitHub Runner
  block:
    - name: Register the GitHub Runner
      ansible.builtin.command: >
        ./config.sh --url "https://github.com/{{ runner_setup_github_owner }}/{{ runner_setup_github_repo }}"
        --token "{{ runner_setup_github_token }}" --unattended --replace
      args:
        chdir: /home/azureuser/actions-runner
        creates: /home/azureuser/actions-runner/.runner
      become: true
      become_user: azureuser
      register: runner_setup_registration
      changed_when: true
      no_log: true
  rescue:
    - name: Report runner registration failure without its token
      ansible.builtin.fail:
        msg: |
          GitHub runner registration failed (rc={{ runner_setup_registration.rc | default('unknown') }}).
          stdout: {{ runner_setup_registration.stdout | default('') | replace(runner_setup_github_token, '[REDACTED]') }}
          stderr: {{ runner_setup_registration.stderr | default('') | replace(runner_setup_github_token, '[REDACTED]') }}

- name: Install runner service
  ansible.builtin.command: ./svc.sh install
  args:
    chdir: /home/azureuser/actions-runner
    creates: "/etc/systemd/system/actions.runner.{{ runner_setup_github_owner }}-{{ runner_setup_github_repo }}.*.service"
  changed_when: true

- name: Start runner service
  ansible.builtin.command: ./svc.sh start
  args:
    chdir: /home/azureuser/actions-runner
  register: start_runner
  changed_when: start_runner.rc == 0
